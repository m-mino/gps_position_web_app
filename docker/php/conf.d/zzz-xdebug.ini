; Xdebug 3 — docker-php-ext-xdebug.ini（zend_extension）より後に読み込むため zzz 接頭辞
; Cursor: 先に F5「Listen for Xdebug」で待受 → Docker 内で PHP を実行
; コンテナ→ホスト接続のため launch.json の hostname は 0.0.0.0 にすること
;
; start_with_request=trigger … リクエストに付与が必要:
;   Web: URL に ?XDEBUG_TRIGGER=1 または Cookie
;   CLI (tinker): XDEBUG_TRIGGER=1 を付ける（.vscode/tasks.json のタスク推奨）
xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
; トラブル時のみ 1 にして /tmp/xdebug.log を確認
xdebug.log_level=0
