services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gps_position_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      # ホスト（Windows）との同期は小ファイルが多いと遅くなる。
      # vendor / bootstrap/cache は名前付きボリューム＝Linux 側のみ（ホストの vendor とは別。コピー不要）。
      # 初回・空ボリューム時は entrypoint が composer install を実行。手動: docker compose exec app composer install
      # node_modules はホストで npm する場合があるためバインドのまま（必要なら別 Node サービスで名前付き化を検討）。
      # ※ PHP の実行は app のみ。Nginx は public を配信するため vendor は不要。
      # storage/framework/views は Windows バインドマウント上で touch()/utime が失敗するため名前付きボリュームにする
      - .:/var/www
      - vendor_data:/var/www/vendor
      - bootstrap_cache_data:/var/www/bootstrap/cache
      - storage_views_data:/var/www/storage/framework/views
    networks:
      - gps_position
    depends_on:
      mysql:
        condition: service_healthy
    # Xdebug 3 が IDE（ホスト）へ接続するため（Linux の Docker でも有効化）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # composer.json がある場合は vendor の準備完了を待つ。未初期化時は php-fpm の起動を確認する
      test: ["CMD-SHELL", "if [ -f /var/www/composer.json ]; then test -f /var/www/vendor/autoload.php; else kill -0 1; fi"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s
    environment: &app_environment
      TMPDIR: /tmp
      # Blade コンパイル先。Windows バインド上の touch()/utime 失敗を避ける
      VIEW_COMPILED_PATH: /tmp/laravel-views
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gps_position}
      DB_USERNAME: ${DB_USERNAME:-gps_position}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      TEST_DB_DATABASE: ${TEST_DB_DATABASE:-gps_position_testing}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      BROADCAST_CONNECTION: reverb
      # コンテナ内から Reverb へ配信するためのホスト（ブラウザ向けは .env の localhost）
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gps_position_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
      - bootstrap_cache_data:/var/www/bootstrap/cache
      - storage_views_data:/var/www/storage/framework/views
    networks:
      - gps_position
    depends_on:
      app:
        condition: service_healthy
    environment: *app_environment
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gps_position_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
      - bootstrap_cache_data:/var/www/bootstrap/cache
      - storage_views_data:/var/www/storage/framework/views
    networks:
      - gps_position
    depends_on:
      app:
        condition: service_healthy
    environment: *app_environment
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gps_position_reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
      - bootstrap_cache_data:/var/www/bootstrap/cache
      - storage_views_data:/var/www/storage/framework/views
    networks:
      - gps_position
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app_environment
      # WebSocket クライアントの Host 検証用（ブラウザは localhost:8080 経由）
      REVERB_HOST: localhost
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  nginx:
    image: nginx:1.27-alpine
    container_name: gps_position_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gps_position
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: gps_position_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gps_position}
      MYSQL_USER: ${DB_USERNAME:-gps_position}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - gps_position
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  gps_position:
    driver: bridge

volumes:
  mysql_data:
  vendor_data:
  bootstrap_cache_data:
  storage_views_data:
